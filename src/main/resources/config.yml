# MiniGamesWR Configuration
# Wild Rose MC - Minigames Server

# Void world generator settings.
# Set enabled: true and configure world-name to match the world that should
# be generated as void.  The generator must also be referenced in
# bukkit.yml (generator: MiniGamesWR) for the target world.
void-generator:
  enabled: false
  world-name: world
  spawn-platform:
    enabled: true
    # Produces exactly size×size blocks centred around the hub spawn.
    # Example: size: 4 → 4×4 = 16 blocks placed.
    size: 5
    material: STONE

# Hub spawn location
hub:
  world: world
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# Duels (1v1) arena configuration
duels:
  world: world
  spawnA:
    x: 10.5
    y: 64.0
    z: 0.5
    yaw: 90.0
    pitch: 0.0
  spawnB:
    x: -10.5
    y: 64.0
    z: 0.5
    yaw: 270.0
    pitch: 0.0
  # Kit given to each player at the start of a duel
  kit:
    helmet: IRON_HELMET
    chestplate: IRON_CHESTPLATE
    leggings: IRON_LEGGINGS
    boots: IRON_BOOTS
    # Hotbar/inventory items: key is the slot number (0-8 = hotbar)
    items:
      "0":
        material: IRON_SWORD
        amount: 1
      "1":
        material: COOKED_BEEF
        amount: 16

# Spliff arena configuration
spliff:
  world: world
  # Block type players may break during the match
  block: SNOW_BLOCK
  # Players falling below this Y level are eliminated
  lose-y: 0
  # Arena region corners for reset (fill with 'block' type)
  pos1:
    x: -20
    y: 63
    z: -20
  pos2:
    x: 20
    y: 63
    z: 20
  # Spawn points (add more with /mg spliff addspawn)
  spawnpoints: []

# Spleef arenas configuration
# Arenas are created and managed via /mg spleef arena commands.
# Each named arena stores its own region, spawn points, optional lobby,
# and references a snapshot file saved in plugins/MiniGamesWR/snapshots/.
#
# Example after running the setup commands:
#
# spleef:
#   arenas:
#     main:
#       world: world
#       pos1: {x: -20, y: 63, z: -20}
#       pos2: {x: 20, y: 63, z: 20}
#       spawnpoints:
#         - {x: -5.0, y: 65.0, z: 0.0, yaw: 90.0, pitch: 0.0}
#         - {x: 5.0, y: 65.0, z: 0.0, yaw: 270.0, pitch: 0.0}
#       lobby: {world: world, x: 0.5, y: 64.0, z: 0.5, yaw: 0.0, pitch: 0.0}
spleef:
  arenas: {}
