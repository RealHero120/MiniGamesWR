plugins {
    id 'java'
}

group = 'com.wildrose'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // Paper 1.21.1-R0.1-SNAPSHOT is the closest published snapshot for the 1.21.x line.
    // Paper does not publish patch-level coordinates (e.g. 1.21.11); use this artifact
    // for compilation and keep plugin.yml api-version set to '1.21' for runtime compatibility.
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

processResources {
    expand(project.properties)
}

jar {
    archiveBaseName = 'MiniGamesWR'
}
